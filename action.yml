name: 'PTC Translate'
description: 'Translate source files with Private Translation Cloud (WPML) and optionally open a pull request with the results.'
author: 'OnTheGoSystems'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  api-token:
    description: 'PTC API token: your agent token (one secret for every product of a repository) or a project token. Pass the secrets.PTC_API_TOKEN value. With permissions id-token: write the action also proves its run to the agent guide with the GitHub identity token (audience ptc). Sent to PTC via the PTC_API_TOKEN env var only — never on the command line.'
    required: true
  config-file:
    description: 'Path to .ptc-config.yml. Optional — a .ptc-config.yml committed at the repository root is picked up on its own, and with no config at all the action detects the layout itself (see below). Takes precedence over source-locale/patterns.'
    required: false
    default: ''
  source-locale:
    description: 'Source language code (e.g. "en"). Only needed to override detection; use together with `patterns`.'
    required: false
    default: ''
  patterns:
    description: 'Comma-separated glob(s) where {{lang}} marks the language slot, e.g. "src/locales/{{lang}}.json". Only needed to override detection.'
    required: false
    default: ''
  file-tag-name:
    description: 'PTC file tag (branch-scoped batch). Defaults to git-branch auto-detect inside the CLI.'
    required: false
    default: ''
  monitor-interval:
    description: 'Seconds between translation-status polls. CLI default is 5. Raise it on large projects to poll less often.'
    required: false
    default: ''
  monitor-max-attempts:
    description: 'How many times to poll before giving up. Left empty, the CLI uses max(100, 20 x files pushed), i.e. at least ~8 minutes at the default interval and 100 s per file beyond five files — a run that needs longer stops with exit 7 (see monitor-max-minutes). A value given here is used as is.'
    required: false
    default: ''
  monitor-max-minutes:
    description: 'Wall-clock bound on the run, counted from the first upload (CLI default 45). Reached with files still translating, the finished translations are delivered, the CLI prints the options (re-run the job once PTC finishes, check progress, download manually) and the job fails with exit 7 ("translation still running in PTC"). Keep it below the job timeout-minutes.'
    required: false
    default: ''
  api-url:
    description: 'PTC API base URL. Override only for a self-hosted instance. Left at this default, an api_url in the config file is used instead.'
    required: false
    default: 'https://app.ptc.wpml.org/api/v1/'
  project-dir:
    description: 'Directory the CLI treats as the project root.'
    required: false
    default: '.'
  create-pr:
    description: 'If "true", open (or update) a pull request with the translations. Requires the "Allow GitHub Actions to create and approve pull requests" org/repo setting.'
    required: false
    default: 'false'
  pr-token:
    description: 'Token used to open the PR. Leave empty to use GITHUB_TOKEN; supply a PAT or GitHub App token so the translation PR triggers your downstream CI (GITHUB_TOKEN-opened PRs do not). Composite-action input defaults cannot evaluate github.token, so the fallback happens in the step.'
    required: false
    default: ''
  guide-report:
    description: 'If "true" (default), report this run (scan, parsed config, commit, source-file sample) to PTC for its agent guide. Never fails the run.'
    required: false
    default: 'true'
  guide-check:
    description: 'If "true", after reporting the run and BEFORE translating, ask PTC which information is missing for this commit (`ptc guide check`; it never withholds the translation) and expose the verdict as the guide-check output (pass / fail / error). With create-pr, PTC''s findings are posted as ONE comment on the translation pull request (needs permissions: pull-requests: write; switched off per project in PTC). Set guide-check-fail to "true" to fail the job on fail / error.'
    required: false
    default: 'false'
  guide-check-fail:
    description: 'If "true", a guide-check verdict other than pass fails the job (exit 1 on fail, 2 when PTC cannot evaluate). The job fails in its own last step, AFTER the translation and its pull request: missing information never withholds a delivery (the check finds missing information only; delivered translations are PTC''s own bookkeeping).'
    required: false
    default: 'false'
  pr-branch:
    description: 'Stable branch the translation PR is pushed to. Re-runs update the SAME PR instead of spawning new ones (loop-safe).'
    required: false
    default: 'ptc/translations'

outputs:
  guide-check:
    description: 'The agent-guide gate verdict for this commit when guide-check=true: pass, fail, or error (PTC could not evaluate).'
    value: ${{ steps.ptc.outputs.guide-check }}
  pr-number:
    description: 'The pull request number, when create-pr=true and there were changes.'
    value: ${{ steps.cpr.outputs.pull-request-number }}
  pr-url:
    description: 'The pull request URL, when create-pr=true and there were changes.'
    value: ${{ steps.cpr.outputs.pull-request-url }}

runs:
  using: 'composite'
  steps:
    # Refuse before the CLI runs, not after: a translation costs credits and
    # minutes, and a caller who asked for a pull request should not pay for one
    # that cannot be opened.
    #
    # `github.ref_name` is the branch on push and schedule, and that is the only
    # shape create-pull-request can use. Elsewhere it is not a branch at all:
    #
    #   pull_request / pull_request_target
    #       The run sits on `NN/merge`, GitHub's internal merge ref. Worse than
    #       unusable: the translations were produced from base+head, so they
    #       cover source strings that exist in neither branch on its own.
    #       Opening the pull request against the base branch - which is what
    #       reading it off the event would do - quietly proposes translations
    #       for strings the base has never seen, and create-pull-request
    #       cherry-picks them with `--strategy-option=theirs`, so a conflict
    #       does not even stop it. Basing it on the head branch instead is a
    #       different feature: it needs a per-pull-request `pr-branch`, because
    #       create-pull-request matches an existing pull request on head AND
    #       base, and a fork's head branch is not ours to push to.
    #   merge_group
    #       `gh-readonly-queue/<base>/pr-N-<sha>` is real but temporary: it is
    #       deleted when the queue resolves, orphaning the pull request.
    #   release, a tag push, workflow_dispatch on a tag
    #       `ref_name` is the tag. The local half succeeds and the branch is
    #       pushed before the API answers 422 for a base that is not a branch.
    - name: Check this event can carry a translation pull request
      id: gate
      if: ${{ inputs.create-pr == 'true' }}
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        case "$EVENT_NAME" in
          pull_request)
            echo "::error::PTC will not open a translation pull request on a pull_request event. This run is on the merge ref ($REF_NAME), so the translations cover strings that exist in neither the base nor the head branch on its own, and any pull request opened from here targets a branch that never contained them. Run PTC on a push to your source branch instead, or set create-pr: 'false' here."
            exit 1 ;;
          pull_request_target)
            # Not the merge ref: on this event the checkout is the base branch,
            # and $REF_NAME is a real branch, so a pull request would open. The
            # objection is what it would carry. pull_request_target runs with a
            # write-scoped token against the base repository while the workspace
            # can hold a fork's content, so committing from here writes a
            # contributor's files into a branch of the base repository under
            # our name. This one worked before and is withdrawn deliberately.
            echo "::error::PTC will not open a translation pull request on a pull_request_target event. That event runs with write access to this repository while the workspace can contain a fork's files, so a pull request opened here would commit contributor-controlled content into $REF_NAME under the workflow's own token. Translate on a push to your source branch instead, or set create-pr: 'false' here."
            exit 1 ;;
          merge_group)
            echo "::error::PTC will not open a translation pull request on a merge_group event: $REF_NAME is a temporary queue branch that is deleted when the merge queue resolves, which would orphan the pull request. Run PTC on a push to your source branch instead, or set create-pr: 'false' here."
            exit 1 ;;
        esac
        if [ "$REF_TYPE" != "branch" ]; then
          echo "::error::PTC will not open a translation pull request here: a pull request needs a base branch, and this run is not on one (ref_type='${REF_TYPE:-unknown}', ref='${REF_NAME:-unknown}'). A tag or a release is the usual reason. Run PTC on a push to a branch instead, or set create-pr: 'false' here."
          exit 1
        fi
        echo "Event $EVENT_NAME on branch $REF_NAME can carry a translation pull request."

    - name: Translate with PTC
      id: ptc
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        PTC_API_TOKEN: ${{ inputs.api-token }}   # token via env, never argv
        # Every other input rides an env var for the same reason the token does.
        # `${{ }}` pastes the raw value into the script *before* bash parses it,
        # so an input carrying shell syntax is executed rather than read. Passing
        # it through the environment and dereferencing "$INPUT_*" below keeps a
        # value a value, whatever it contains.
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_SOURCE_LOCALE: ${{ inputs.source-locale }}
        INPUT_PATTERNS: ${{ inputs.patterns }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_FILE_TAG_NAME: ${{ inputs.file-tag-name }}
        INPUT_MONITOR_INTERVAL: ${{ inputs.monitor-interval }}
        INPUT_MONITOR_MAX_ATTEMPTS: ${{ inputs.monitor-max-attempts }}
        INPUT_MONITOR_MAX_MINUTES: ${{ inputs.monitor-max-minutes }}
        ACTION_PATH: ${{ github.action_path }}
        INPUT_CREATE_PR: ${{ inputs.create-pr }}
        INPUT_GUIDE_REPORT: ${{ inputs.guide-report }}
        INPUT_GUIDE_CHECK: ${{ inputs.guide-check }}
        INPUT_GUIDE_CHECK_FAIL: ${{ inputs.guide-check-fail }}
      run: |
        set -euo pipefail
        echo "::add-mask::${PTC_API_TOKEN}"

        # Record the working tree before anything runs, so that afterwards the
        # files this run wrote can be told from what the caller's job left
        # behind. `ptc init` runs after this line on purpose - a config it
        # writes counts as ours and reaches the pull request, as it did when
        # the whole workspace was committed.
        #
        # Only when a pull request was asked for: the snapshot needs a git
        # repository, and translating without one is otherwise fine.
        RUN_SNAPSHOT=""
        if [ "${INPUT_CREATE_PR:-false}" = "true" ]; then
          . "$ACTION_PATH/lib/translation-paths.sh"
          RUN_SNAPSHOT="$(mktemp "${RUNNER_TEMP:-/tmp}/ptc-worktree.XXXXXX")"
          ptc_snapshot_worktree "$RUN_SNAPSHOT"
        fi
        CLI="$ACTION_PATH/ptc-cli.sh"   # vendored + pinned, never curled at runtime
        chmod +x "$CLI"

        # api-token is the only required input. Resolution order,
        # first match wins:
        #
        #   1. config-file      — an explicit path the caller passed
        #   2. .ptc-config.yml  — one committed to the repository
        #   3. source-locale + patterns — the caller spelled it out inline
        #   4. nothing          — run `ptc init` right here and use what it writes
        #
        # (4) is why the action exists in this shape: the CLI is already
        # vendored inside it, and `ptc init` needs no token (it asks the public
        # detect_config endpoint), so the action can work out the project's
        # layout itself. Before this, a caller who had not run `ptc init`
        # locally had to hand-write source-locale + patterns, which is exactly
        # the copy-paste step the whole on-ramp was meant to remove.
        CONFIG="$INPUT_CONFIG_FILE"
        SOURCE_LOCALE="$INPUT_SOURCE_LOCALE"
        PATTERNS="$INPUT_PATTERNS"

        if [ -z "$CONFIG" ] && [ -f .ptc-config.yml ]; then
          CONFIG=".ptc-config.yml"
          echo "Using the .ptc-config.yml committed to this repository."
        fi

        if [ -z "$CONFIG" ] && { [ -z "$SOURCE_LOCALE" ] || [ -z "$PATTERNS" ]; }; then
          echo "No config and no source-locale/patterns — detecting the layout with \`ptc init\`."
          if ! "$CLI" init --yes --api-url "$INPUT_API_URL"; then
            echo "::error::Could not detect this project's translatable files. Pass config-file, or source-locale + patterns."
            exit 1
          fi
          CONFIG=".ptc-config.yml"
          # A layout the classifier does not recognise still writes a config —
          # a commented template with no files: block. Fail here, with the
          # reason, rather than let the CLI stop on a config it cannot use.
          if ! grep -qE '^files:' .ptc-config.yml; then
            echo "::error::\`ptc init\` could not identify translatable files here. Pass config-file, or source-locale + patterns."
            exit 1
          fi
          echo "Detected layout:"
          sed 's/^/  /' .ptc-config.yml
        fi

        # AGD-11: a config's api_url wins over the api-url input's default (never over an explicit input).
        . "$ACTION_PATH/lib/api-url.sh"
        INPUT_API_URL="$(ptc_effective_api_url "$INPUT_API_URL" "$CONFIG")"

        # Agent guide: tell PTC what this run saw (scan + parsed config +
        # commit). PTC verifies the guide's steps against it - tier-1 proof -
        # and ignores it when the guide is off. It must never cost the caller
        # a translation, so every failure here is a notice, not an error.
        if [ "${INPUT_GUIDE_REPORT:-true}" = "true" ]; then
          guide_args=( guide action-run --api-url "$INPUT_API_URL" )
          [ -n "$CONFIG" ] && guide_args+=( --config-file "$CONFIG" )
          "$CLI" "${guide_args[@]}" || echo "PTC guide report skipped (the run continues)."
        fi
        # P4 (R2, check-first): the agent-guide check runs BEFORE the translation and only reports missing information;
        # it never withholds the translation (R1). Its JSON feeds the findings comment on the translation pull request.
        if [ "${INPUT_GUIDE_CHECK:-false}" = "true" ]; then
          check_rc=0
          CHECK_JSON="$(mktemp "${RUNNER_TEMP:-/tmp}/ptc-guide-check.XXXXXX")"
          check_args=( guide check --json --api-url "$INPUT_API_URL" )
          [ -n "$CONFIG" ] && check_args+=( --config-file "$CONFIG" )
          PTC_ORG_TOKEN="${PTC_ORG_TOKEN:-$PTC_API_TOKEN}" "$CLI" "${check_args[@]}" > "$CHECK_JSON" || check_rc=$?
          python3 - "$CHECK_JSON" <<'PY_CHECK' || true
        import json, sys
        try:
            d = json.load(open(sys.argv[1]))
        except Exception:
            print("PTC agent-guide check: no readable answer"); sys.exit(0)
        if d.get("verdict") == "error":
            e = d.get("error") or {}
            print("PTC agent-guide check cannot evaluate (%s): %s" % (e.get("code"), e.get("message"))); sys.exit(0)
        print("PTC agent-guide check: %s (%s reasons, %s notes)" % (d.get("verdict"), d.get("reasons_total", 0), d.get("notes_total", 0)))
        for r in d.get("reasons") or []:
            print("  [%s] %s" % (r.get("code"), r.get("message")))
        for n in d.get("notes") or []:
            print("  note: %s" % n.get("message"))
        PY_CHECK
          case "$check_rc" in 0) verdict=pass ;; 1) verdict=fail ;; *) verdict=error ;; esac
          echo "guide-check=$verdict" >> "$GITHUB_OUTPUT"
          echo "guide-check-rc=$check_rc" >> "$GITHUB_OUTPUT"
          echo "guide-check-json=$CHECK_JSON" >> "$GITHUB_OUTPUT"
        fi
        args=( --api-url "$INPUT_API_URL" )
        [ -n "$CONFIG" ]        && args+=( --config-file "$CONFIG" )
        [ -n "$SOURCE_LOCALE" ] && [ -z "$CONFIG" ] && args+=( --source-locale "$SOURCE_LOCALE" )
        [ -n "$PATTERNS" ]      && [ -z "$CONFIG" ] && args+=( --patterns "$PATTERNS" )
        [ -n "$INPUT_FILE_TAG_NAME" ] && args+=( --file-tag-name "$INPUT_FILE_TAG_NAME" )
        [ -n "$INPUT_MONITOR_INTERVAL" ]     && args+=( --monitor-interval "$INPUT_MONITOR_INTERVAL" )
        [ -n "$INPUT_MONITOR_MAX_ATTEMPTS" ] && args+=( --monitor-max-attempts "$INPUT_MONITOR_MAX_ATTEMPTS" )
        [ -n "$INPUT_MONITOR_MAX_MINUTES" ]  && args+=( --monitor-max-minutes "$INPUT_MONITOR_MAX_MINUTES" )
        # Exit 5 = partial (E20): PTC rejected some files (e.g. a processing 422) or could not be reached for them
        # (S2-R12, S2-R19), and every other file completed
        # and was written. Those translations are still delivered below; the last step then fails the job and
        # names the rejected files. Exit 6 = partial too (S2-R15, CI-16): some files wait for an over-limit approval in
        # PTC; every other file is delivered the same way and the last step fails the job with the approval as the
        # reason. Exit 7 (S2-R3B F-2, CI-16): the translation is still running in PTC at the CLI's monitor bound; every
        # finished file is delivered the same way, the report step tells PTC the run stopped, and the last step fails
        # the job with the options. Any other failure stops here, as before.
        cli_rc=0
        "$CLI" "${args[@]}" || cli_rc=$?
        echo "cli-exit=$cli_rc" >> "$GITHUB_OUTPUT"

        # G8 gate: PTC's verdict for this commit's run (never opens tasks). Exit 0 pass / 1 fail / 2 cannot evaluate.
        # Order (P3-FIX6, P4 R1): AFTER the translation, and it never stops this step: missing information never withholds
        # a delivery, so a gate that exited before the translation and its pull request would block the delivery. With
        # guide-check-fail the job fails in the "Fail on the agent-guide check" step, after the pull request is opened.
        # P3-FIX7 (AGD-12, POL-40): it also runs when the translation failed, report-only: this step still exits with
        # the translation's exit code, and the "Fail on the agent-guide check" step reports both.
        if [ "$cli_rc" -ne 0 ] && [ "$cli_rc" -ne 5 ] && [ "$cli_rc" -ne 6 ] && [ "$cli_rc" -ne 7 ]; then
          exit "$cli_rc"
        fi

        # The pull request must carry translation output and nothing else.
        # Committing the whole workspace sweeps in anything the caller's job
        # left dirty before us - a build, a codegen, a lockfile rewritten by an
        # install - and ships it under our name.
        #
        # Which paths those are is OBSERVED, not derived from the config. The
        # config's `output:` looks like the answer and is not: the CLI sends it
        # to the API as `output_file_path` and unpacks the returned archive
        # next to the SOURCE file, by basename. A config whose `output:` points
        # anywhere else yields a list matching nothing - and `git add` dies on
        # the first non-matching pathspec, staging nothing at all, after which
        # create-pull-request commits an empty index and fails with the literal
        # message "Unexpected error: ". Observation also picks up what no
        # config-derived list could: the `path:` entries of
        # `additional_translation_files:`, a monorepo where the CLI finds
        # sources at any depth, and a locale written for the first time.
        #
        # Content, not timestamps: the CLI unpacks translations from a ZIP,
        # ZIP stores mtimes to two seconds, and unzip restores them from the
        # archive - so a translation written moments ago can be dated before
        # the run started.
        ADD_PATHS=""
        if [ -n "$RUN_SNAPSHOT" ]; then
          ADD_PATHS="$(ptc_translation_paths "$RUN_SNAPSHOT")"
          rm -f "$RUN_SNAPSHOT"
        fi

        if [ -z "$ADD_PATHS" ]; then
          # Nothing was written, so there is nothing to open a pull request
          # about. Saying so beats the old fallback, which asked
          # create-pull-request to stage the entire repository.
          if [ -n "$(git status --porcelain --ignored 2>/dev/null | grep '^!!' || true)" ]; then
            echo "This run produced no change git can commit. Some paths here are covered by .gitignore - if that includes where translations are written, git cannot put them in a pull request."
          else
            echo "This run produced no change git can see, so there is nothing to open a pull request about."
          fi
        else
          echo "Translation output staged for the pull request:"
          printf '%s\n' "$ADD_PATHS" | sed 's/^/  /'
        fi

        if [ -z "$ADD_PATHS" ]; then
          # The plain empty form, not an empty heredoc body: a heredoc whose
          # body is one blank line leaves the output holding a newline, and
          # whether the runner trims that is not something to bet the caller's
          # repository on - `add-paths` that arrives as whitespace makes
          # create-pull-request fall back to `git add -A`.
          echo "add-paths=" >> "$GITHUB_OUTPUT"
        else
          # A random delimiter, because the values are file names: a repository
          # containing a file named after a fixed delimiter could otherwise
          # close the block early and append whatever it liked to the outputs.
          DELIM="PTC_ADD_PATHS_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          {
            echo "add-paths<<$DELIM"
            printf '%s\n' "$ADD_PATHS"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Create/update translation pull request
      id: cpr
      # An empty add-paths means the run wrote nothing. Skipping is not a
      # detail: create-pull-request treats an empty add-paths as `git add -A`,
      # so the alternative is committing the caller's entire workspace.
      if: ${{ inputs.create-pr == 'true' && steps.ptc.outputs.add-paths != '' }}
      # Pinned to a full commit SHA, not a floating major tag: a mutable tag on a
      # third-party action is a write-access foothold in every consumer's repo.
      # v8 needs Actions Runner >= v2.327.1 (Node 24) on self-hosted runners.
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.pr-token != '' && inputs.pr-token || github.token }}
        branch: ${{ inputs.pr-branch }}
        # Plain ref_name, because the step above has already refused every
        # event where it is not a branch. Reading the base off the event
        # instead would make `pull_request` runs look supported while
        # proposing translations to a branch that never had the source
        # strings - see the gate for why that is worse than refusing.
        base: ${{ github.ref_name }}
        title: 'Update translations from PTC'
        commit-message: 'chore(i18n): update translations via PTC [skip translations]'
        body: |
          Automated translations produced by the **PTC Translate** action.

          - Source: `${{ github.sha }}`
          - Re-runs update this same PR.

          ${{ steps.ptc.outputs.limit-note }}
        delete-branch: true
        add-paths: ${{ steps.ptc.outputs.add-paths }}

    - name: Report the translations-branch commit to PTC
      id: report
      # P4 T14 (R3): PTC counts its delivery once it is OBSERVED on the translations branch: the commit this pull request
      # step made and the sha256 of the delivered files in it. P4-H / S2-R14 (Eran 2026-10-02): a trusted report of PTC's
      # delivery on the translations branch is the delivery proof (PTC closes it; no `ptc validate`, PTC validates what it
      # generates). PTC answers the source commit's check recomputed, which the findings comment and the fail step below
      # read. Best-effort: never fails the job.
      # S2-R3B F-2 (CI-16): it also runs when the translation stopped at the CLI's monitor bound (exit 7) and nothing was
      # committed, so PTC hears that the run stopped and the guide says "re-run the job" instead of waiting.
      if: ${{ !cancelled() && inputs.guide-report == 'true' && (steps.cpr.outputs.pull-request-head-sha != '' || steps.ptc.outputs.cli-exit == '7') }}
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        PTC_API_TOKEN: ${{ inputs.api-token }}
        ACTION_PATH: ${{ github.action_path }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        CLI_EXIT: ${{ steps.ptc.outputs.cli-exit }}
      run: |
        set -uo pipefail
        echo "::add-mask::${PTC_API_TOKEN}"
        OUT="$(mktemp "${RUNNER_TEMP:-/tmp}/ptc-delivery.XXXXXX")"
        args=( guide delivery-commit --source-commit "$GITHUB_SHA" --out "$OUT" )
        if [ -n "${HEAD_SHA:-}" ]; then
          # create-pull-request pushed HEAD_SHA; make sure the commit object is here before reading its files.
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$HEAD_SHA" 2>/dev/null || true
          args+=( --commit "$HEAD_SHA" --branch "$PR_BRANCH" )
        fi
        # The run stopped at its monitor bound while PTC was still translating: reported with the commit, or alone.
        [ "${CLI_EXIT:-}" = "7" ] && args+=( --stopped-reason monitor_bound )
        CONFIG="$INPUT_CONFIG_FILE"
        [ -z "$CONFIG" ] && [ -f .ptc-config.yml ] && CONFIG=.ptc-config.yml
        [ -n "$CONFIG" ] && args+=( --config-file "$CONFIG" )
        # AGD-11: a config's api_url wins over the api-url input's default (never over an explicit input).
        . "$ACTION_PATH/lib/api-url.sh"
        args+=( --api-url "$(ptc_effective_api_url "$INPUT_API_URL" "$CONFIG")" )
        "$ACTION_PATH/ptc-cli.sh" "${args[@]}" || echo "PTC translations-branch report skipped (the run continues)."
        # The recomputed check (with the delivery's verdict) replaces the pre-translation one for the comment and the fail step.
        CHECK_FILE="${OUT}.check.json"
        VERDICT="$(python3 - "$OUT" "$CHECK_FILE" <<'PY_REPORT'
        import json, sys
        try:
            check = json.load(open(sys.argv[1])).get("check")
        except Exception:
            check = None
        if isinstance(check, dict) and check.get("verdict"):
            json.dump(check, open(sys.argv[2], "w"))
            print(check["verdict"])
        PY_REPORT
        )" || VERDICT=""
        if [ -n "$VERDICT" ]; then
          echo "guide-check=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "guide-check-json=$CHECK_FILE" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment the agent-guide findings on the translation pull request
      if: ${{ !cancelled() && inputs.guide-check == 'true' && steps.cpr.outputs.pull-request-number != '' && (steps.report.outputs.guide-check-json || steps.ptc.outputs.guide-check-json) != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pr-token != '' && inputs.pr-token || github.token }}
        PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        CHECK_JSON: ${{ steps.report.outputs.guide-check-json || steps.ptc.outputs.guide-check-json }}
        PR_BRANCH: ${{ inputs.pr-branch }}
      run: |
        # P4 (R4, T5): ONE findings comment per translation pull request (found by PTC's marker and updated in place). PTC
        # composes it (findings, carried-string notes, next action, the project's guide page); the project setting in PTC
        # turns it off. Never fails the job.
        set -uo pipefail
        BODY="$(mktemp "${RUNNER_TEMP:-/tmp}/ptc-guide-comment.XXXXXX")"
        MARKER="$(python3 - "$CHECK_JSON" "$BODY" "$PR_BRANCH" <<'PY_COMMENT'
        import json, sys
        src, out, branch = sys.argv[1:4]
        try:
            d = json.load(open(src))
        except Exception:
            sys.exit(0)
        c = d.get("comment") or {}
        if not c.get("enabled") or not c.get("body"):
            sys.exit(0)
        post = bool(d.get("reasons") or d.get("notes"))
        # T17: the links are GitHub's own documentation pages, fetched and checked 2026-09-28 (anchors seen on the page).
        body = c["body"] + ("\n\nAuto-merge: a repository admin allows it under Settings > General > \"Pull Requests\" > \"Allow auto-merge\" "
                            "(" + "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-auto-merge-for-pull-requests-in-your-repository#managing-auto-merge" + "); then anyone with write access selects \"Enable auto-merge\" on this "
                            "pull request (" + "https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/automatically-merging-a-pull-request#enabling-auto-merge" + ")."
                            "\nFetch the translations branch: `git fetch origin " + branch + "`")
        open(out, "w").write(json.dumps({"body": body}))
        print(c.get("marker", "") + ("|post" if post else "|update"))
        PY_COMMENT
        )"
        if [ -z "$MARKER" ]; then
          echo "PTC agent-guide findings comment: off for this project (PTC project setting) or no check answer"
          exit 0
        fi
        MODE="${MARKER##*|}"; MARKER="${MARKER%|*}"
        # S2-R3B C-5: PTC's marker is data, never spliced into a jq program (gh api has no --arg): the pages are parsed here.
        EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null | MARKER="$MARKER" python3 -c '
        import json, os, sys
        marker, raw, dec, pos = os.environ["MARKER"], sys.stdin.read(), json.JSONDecoder(), 0
        while pos < len(raw):
            while pos < len(raw) and raw[pos].isspace(): pos += 1
            if pos >= len(raw): break
            page, pos = dec.raw_decode(raw, pos)
            for c in page if isinstance(page, list) else []:
                if marker in (c.get("body") or ""):
                    print(c["id"]); sys.exit(0)
        ' 2>/dev/null || true)"
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" --input "$BODY" > /dev/null \
            && echo "PTC agent-guide findings comment updated on #${PR_NUMBER}" || echo "::warning::could not update the PTC findings comment (needs pull-requests: write)"
        elif [ "$MODE" = "post" ]; then
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input "$BODY" > /dev/null \
            && echo "PTC agent-guide findings comment posted on #${PR_NUMBER}" || echo "::warning::could not post the PTC findings comment (needs pull-requests: write)"
        else
          echo "PTC agent-guide check: nothing to report on #${PR_NUMBER}"
        fi
        rm -f "$BODY"

    - name: Fail on the agent-guide check
      # After the translation and its pull request (P3-FIX6): the gate reports, it never withholds the translation.
      # P3-FIX7 (POL-40): when the Translate step failed, this step reports that failure AND the check verdict (the check
      # ran report-only), so a failed translation never hides the gate. The check's own exit code stays 0 / 1 / 2.
      if: ${{ !cancelled() && inputs.guide-check == 'true' && (steps.ptc.outcome == 'failure' || (inputs.guide-check-fail == 'true' && (steps.report.outputs.guide-check || steps.ptc.outputs.guide-check) != 'pass')) }}
      shell: bash
      env:
        VERDICT: ${{ steps.report.outputs.guide-check || steps.ptc.outputs.guide-check }}
        CHECK_RC: ${{ steps.ptc.outputs.guide-check-rc }}
        CLI_EXIT: ${{ steps.ptc.outputs.cli-exit }}
        TRANSLATE: ${{ steps.ptc.outcome }}
        FAIL_ON_CHECK: ${{ inputs.guide-check-fail }}
      run: |
        if [ "$TRANSLATE" = "failure" ]; then
          echo "::error::PTC translate step failed (exit ${CLI_EXIT:-before the translate call}); this run delivered no translation"
        fi
        if [ -z "$VERDICT" ]; then
          echo "::error::PTC agent-guide check: not run (the Translate step stopped before it)"
        elif [ "$VERDICT" = "pass" ]; then
          echo "::notice::PTC agent-guide check: pass (rc ${CHECK_RC})"
        else
          echo "::error::PTC agent-guide check: ${VERDICT} (rc ${CHECK_RC:-2}; see 'guide check' in the Translate step)"
        fi
        if [ "$FAIL_ON_CHECK" = "true" ] && [ "$VERDICT" != "pass" ]; then
          exit "${CHECK_RC:-2}"
        fi
        if [ "$TRANSLATE" = "failure" ]; then
          exit "${CLI_EXIT:-1}"
        fi

    - name: Fail on files PTC rejected
      # After the pull request, so the completed translations are delivered either way (E20).
      if: ${{ steps.ptc.outputs.cli-exit == '5' }}
      shell: bash
      run: |
        echo "::error::PTC rejected some source files or could not be reached for them (listed under 'Rejected by PTC' / 'Could not reach PTC' in the Translate step); the other translations were delivered."
        exit 5

    - name: Fail on files parked for an over-limit approval
      # S2-R15 (CI-16): after the pull request and the delivery-commit report, so every file that was not parked is
      # delivered; the job then fails with the reason and the remedy. The next run picks the parked files up.
      if: ${{ steps.ptc.outputs.cli-exit == '6' }}
      shell: bash
      run: |
        echo "::error::Some files wait in PTC - parked for an over-limit approval, or paused out-of-credit (listed under 'Parked for an over-limit approval' / 'Paused out-of-credit in PTC' in the Translate step); the other translations were delivered. Approve the request in PTC (emailed to the organization's administrators), raise the translation approval limit, or top up the credit, then re-run."
        exit 6

    - name: Fail on files still translating in PTC
      # S2-R3B F-2 (CI-16; Eran 2026-10-04 "explicit options"): after the pull request and the delivery-commit report (which
      # tells PTC the run stopped), so every finished file is delivered; the job then fails with the reason and the options.
      if: ${{ steps.ptc.outputs.cli-exit == '7' }}
      shell: bash
      run: |
        echo "::error::The translation is still running in PTC: the run reached its monitor bound (the files are listed under 'Still translating in PTC' in the Translate step); the finished translations were delivered. Re-run this job once PTC finishes, or check progress / download manually with the commands printed there."
        exit 7
