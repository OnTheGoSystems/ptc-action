# PTC Translate — GitLab CI/CD Catalog component SOURCE.
#
# This file is published nowhere, and nothing PTC prints points at it.
# `include: component:` is resolved by the GitLab instance running the
# pipeline, so a component we publish on our instance can never be included
# from yours. What the product prints for GitLab is a self-contained job —
# see "Quick start (GitLab CI/CD)" in README.md.
#
# It is kept for one case: mirroring this repository into your OWN GitLab and
# publishing it to your own CI/CD Catalog. Then the address is yours and it
# resolves:
#
#   include:
#     - component: $CI_SERVER_FQDN/<your-group>/ptc-action/translate@1
#       inputs:
#         config-file: .ptc-config.yml
#
# Store the token as a MASKED CI/CD variable named PTC_API_TOKEN
# (Settings → CI/CD → Variables). It is never placed on the command line.

spec:
  inputs:
    stage:
      default: deploy
    config-file:
      default: '.ptc-config.yml'
    source-locale:
      default: ''
    patterns:
      default: ''
    api-url:
      default: 'https://app.ptc.wpml.org/api/v1/'
    file-tag-name:
      default: ''
    monitor-interval:
      description: 'Seconds between translation-status polls. CLI default is 5.'
      default: ''
    monitor-max-attempts:
      description: 'How many polls before giving up. CLI default is 100 (~8 min at the default interval); a run that needs longer exits 1 with the unfinished files listed.'
      default: ''
    cli-ref:
      description: 'ptc-cli git ref to fetch. Defaults to the immutable commit behind v1.0.5 — a tag can be moved, a commit cannot.'
      default: '35217510e17c6659f22a44f5191c2c3cdc37b965'
    cli-sha256:
      description: 'Expected sha256 of ptc-cli.sh. Verified after download; set to an empty string to skip (only if you also override cli-ref).'
      default: 'd5b1b2c62c530f43d76aa924e399548379369e458955a31bd11539580d71428d'
    open-mr:
      description: 'Open a merge request with the translations via the git push option.'
      default: 'false'
    mr-target-branch:
      default: '$CI_DEFAULT_BRANCH'
---

"ptc-translate":
  stage: $[[ inputs.stage ]]
  image: alpine:3.22
  # Loop-safe: only on a push to the default branch, and never on a translation commit.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /\[skip translations\]/'
  variables:
    PTC_CLI_URL: "https://raw.githubusercontent.com/OnTheGoSystems/ptc-cli/$[[ inputs.cli-ref ]]/ptc-cli.sh"
  before_script:
    - apk add --no-cache bash curl git unzip
  script:
    # Fetched at an immutable commit and checksum-verified, because a GitLab
    # component ships YAML only - it cannot vendor a sibling file the way the
    # GitHub composite action does.
    - |
      set -eu
      curl -fsSL "$PTC_CLI_URL" -o ptc-cli.sh
      expected_sha="$[[ inputs.cli-sha256 ]]"
      if [ -n "$expected_sha" ]; then
        echo "$expected_sha  ptc-cli.sh" | sha256sum -c -
      else
        echo "WARNING: cli-sha256 is empty - ptc-cli.sh is not being verified."
      fi
      chmod +x ptc-cli.sh
    # POSIX positional parameters, not bash arrays: alpine ships busybox ash and
    # has no /bin/bash until before_script installs it, so this block has to run
    # under either shell. ptc-cli.sh itself is #!/bin/bash and gets bash via apk.
    - |
      set -eu
      set -- --api-url "$[[ inputs.api-url ]]"
      [ -n "$[[ inputs.config-file ]]" ]   && set -- "$@" --config-file "$[[ inputs.config-file ]]"
      [ -n "$[[ inputs.source-locale ]]" ] && set -- "$@" --source-locale "$[[ inputs.source-locale ]]"
      [ -n "$[[ inputs.patterns ]]" ]      && set -- "$@" --patterns "$[[ inputs.patterns ]]"
      [ -n "$[[ inputs.file-tag-name ]]" ] && set -- "$@" --file-tag-name "$[[ inputs.file-tag-name ]]"
      [ -n "$[[ inputs.monitor-interval ]]" ]     && set -- "$@" --monitor-interval "$[[ inputs.monitor-interval ]]"
      [ -n "$[[ inputs.monitor-max-attempts ]]" ] && set -- "$@" --monitor-max-attempts "$[[ inputs.monitor-max-attempts ]]"
      # Record the working tree BEFORE the CLI runs; what differs afterwards is
      # what this run wrote. Kept outside the project directory, or the file
      # would show up as something this run wrote.
      #
      # Inlined from lib/gitlab-scope.sh, which is where it is tested - a
      # component ships YAML only and cannot vendor a sibling file. A test
      # fails if the two drift apart.
      # ptc_snapshot
      #   Prints "<blob-hash> <path>" for every file git can see as changed or
      #   untracked. Call it BEFORE the CLI runs and keep the output; what differs
      #   afterwards is what the run wrote.
      #
      #   Hashes, not timestamps: the CLI unpacks translations from a ZIP, ZIP stores
      #   mtimes at two-second granularity, and unzip restores them from the archive,
      #   so a translation written moments ago can carry a timestamp from before the
      #   run began.
      ptc_snapshot() {
        # -uall so an untracked directory is listed file by file rather than
        # abbreviated to "dir/", which is neither hashable nor stageable as one path.
        # -z then `tr` because git quotes unusual paths otherwise; a path containing
        # a newline survives neither, and is dropped by the -f test below.
        git status --porcelain=v1 -uall -z 2>/dev/null | tr '\0' '\n' | while IFS= read -r entry; do
          [ -n "$entry" ] || continue
          path=$(printf '%s' "$entry" | cut -c4-)
          # Skips deletions, submodule entries, and the stray fragments a path
          # containing a newline would leave behind.
          [ -f "$path" ] || continue
          printf '%s %s\n' "$(git hash-object -- "$path" 2>/dev/null)" "$path"
        done | LC_ALL=C sort
      }

      # ptc_commit_scoped <snapshot-file> <commit-message>
      #   Stages every file whose content differs from the snapshot, commits, and
      #   returns 0. Returns 1 when the run wrote nothing, so the caller can skip the
      #   push instead of pushing an empty branch.
      ptc_commit_scoped() {
        snapshot="$1"
        message="$2"

        if [ ! -f "$snapshot" ]; then
          echo "ptc: no snapshot at '$snapshot'; refusing to guess what this run wrote" >&2
          return 1
        fi

        after=$(mktemp)
        changed=$(mktemp)
        ptc_snapshot > "$after"
        # LC_ALL=C on comm as well as on the sorts: comm compares with strcoll, and
        # two files with identical content - normal for locale files - tie-break on
        # the path, where a locale like en_US disagrees with C about the order.
        LC_ALL=C comm -13 "$snapshot" "$after" | cut -d' ' -f2- > "$changed"
        rm -f "$after"

        if [ ! -s "$changed" ]; then
          rm -f "$changed"
          echo "ptc: this run wrote nothing git can commit; not opening a merge request."
          return 1
        fi

        echo "ptc: committing what this run wrote:"
        sed 's/^/  /' "$changed"

        # One at a time, and literally: `git add -- <path>` takes a PATHSPEC, so a
        # translation written to messages[1].json would otherwise stage the caller's
        # messages1.json instead - and exit 0 while doing it.
        while IFS= read -r path; do
          [ -n "$path" ] || continue
          GIT_LITERAL_PATHSPECS=1 git add -- "$path"
        done < "$changed"
        rm -f "$changed"

        # The index, not the working tree: `git diff --quiet` here would repeat the
        # first-run bug this function exists to remove.
        if git diff --cached --quiet; then
          echo "ptc: nothing staged after all; not opening a merge request."
          return 1
        fi

        git commit -m "$message"
      }

      ptc_snapshot > /tmp/ptc-worktree-before

      ./ptc-cli.sh "$@"   # PTC_API_TOKEN comes from the masked CI/CD variable
    - |
      set -eu
      if [ "$[[ inputs.open-mr ]]" = "true" ]; then
        git config user.email "ci@ptc"
        git config user.name "PTC Translate"
        git checkout -B ptc/translations
        # Only push when something was actually committed. The old guard asked
        # `git diff --quiet` before staging, and `git diff` looks only at
        # tracked files - on a first run every translation is a new file, so it
        # reported "nothing changed" and left a green job with no merge request.
        if ptc_commit_scoped /tmp/ptc-worktree-before "chore(i18n): update translations via PTC [skip translations]"; then
          git push -o merge_request.create \
                   -o merge_request.target="$[[ inputs.mr-target-branch ]]" \
                   -o merge_request.title="Update translations from PTC" \
                   -f "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:ptc/translations
        fi
      fi
