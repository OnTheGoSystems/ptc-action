name: Self-test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Guardrail so we never publish a broken @v1: lint the vendored CLI, confirm it is
# the pinned version, and sanity-check the composite action metadata.
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PINNED_CLI_VERSION: '1.0.5'
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck the vendored CLI
        run: shellcheck ptc-cli.sh || true   # advisory: the CLI is owned upstream

      # Not advisory: this one is ours, and it ships into every consumer's
      # runner. SC1091 only says the test cannot follow its own `source`.
      - name: shellcheck what we wrote
        run: shellcheck --exclude=SC1091 lib/*.sh tests/*.sh tests/act/run.sh

      - name: vendored CLI matches the pinned version
        run: |
          set -euo pipefail
          got=$(grep -m1 -oE 'VERSION="[^"]+"' ptc-cli.sh | cut -d'"' -f2)
          echo "vendored ptc-cli VERSION=$got (expected $PINNED_CLI_VERSION)"
          test "$got" = "$PINNED_CLI_VERSION"

      - name: action.yml parses and declares required inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml, sys
          a = yaml.safe_load(open('action.yml'))
          assert a['runs']['using'] == 'composite', 'action must be composite'
          assert a['inputs']['api-token']['required'] is True, 'api-token must be required'
          # api-token is the ONLY required input: with nothing else
          # set, the action runs `ptc init` itself and uses what it detects.
          for optional in ('config-file', 'source-locale', 'patterns'):
              assert a['inputs'][optional].get('required', False) is False, f'{optional} must stay optional'
          steps = a['runs']['steps']
          translate = next(s for s in steps if s.get('id') == 'ptc')
          assert 'init --yes' in translate['run'], 'the action must be able to detect the layout itself'
          print('action.yml OK:', a['name'])
          PY

      - name: no input is interpolated into a run body
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          # Expression interpolation is resolved before bash parses the script,
          # so an input pasted into a run body executes whatever shell syntax it
          # carries. Inputs must arrive through env: and be read as "$INPUT_*".
          #
          # This file cannot spell the delimiters literally: everything inside a
          # run body is itself interpolated, so writing them here would make the
          # workflow fail to load. Hence the assembled OPEN below.
          OPEN = '$' + '{' + '{'
          steps = yaml.safe_load(open('action.yml'))['runs']['steps']
          offenders = []
          for step in steps:
              body = step.get('run')
              if not body:
                  continue
              for lineno, line in enumerate(body.splitlines(), 1):
                  if line.lstrip().startswith('#'):
                      continue
                  if OPEN in line:
                      offenders.append(f"{step.get('name', '?')} line {lineno}: {line.strip()}")
          assert not offenders, (
              'an input is interpolated into a run body; pass it via env instead:\n'
              + '\n'.join(offenders)
          )
          print('no expression interpolation inside any run body')
          PY

      - name: every third-party action is pinned to a commit SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, glob, sys
          bad = []
          for f in ['action.yml'] + glob.glob('.github/workflows/*.yml'):
              for n, line in enumerate(open(f), 1):
                  m = re.search(r'uses:\s*([\w.-]+/[\w.-]+)@(\S+)', line)
                  # actions/* are first-party GitHub actions; everything else must be SHA-pinned.
                  if m and not m.group(1).startswith('actions/') and not re.fullmatch(r'[0-9a-f]{40}', m.group(2)):
                      bad.append(f'{f}:{n} {m.group(1)}@{m.group(2)}')
          if bad:
              sys.exit('third-party action not SHA-pinned:\n  ' + '\n  '.join(bad))
          print('third-party action pinning OK')
          PY

      - name: GitLab component template parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml, glob
          files = glob.glob('templates/**/*.yml', recursive=True)
          assert files, 'no component templates found'
          for f in files:
              # list() forces the generator - safe_load_all alone parses nothing.
              docs = list(yaml.safe_load_all(open(f)))
              assert docs, f'{f} is empty'
              print(f'{f}: {len(docs)} document(s) OK')
          PY

      # The template stays as a source for anyone mirroring it into their OWN
      # instance, but we must never hand out an address for it. A
      # component address is resolved by the customer's GitLab, so the
      # $CI_SERVER_FQDN in one we print is always their server, and the include
      # fails before any of our code runs.
      - name: no component address is handed out
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys
          # Our own path inside a component address — the exact string a reader
          # could copy. Prose about component: in general is fine.
          pattern = re.compile(r'component:.*OnTheGoSystems/ptc-action')
          bad = []
          for f in ['README.md', 'action.yml'] + glob.glob('templates/**/*.yml', recursive=True):
              for n, line in enumerate(open(f), 1):
                  if pattern.search(line):
                      bad.append(f'{f}:{n} {line.strip()}')
          if bad:
              sys.exit('a component address is being handed out; it cannot resolve '
                       'cross-instance:\n  ' + '\n  '.join(bad))
          print('no component address handed out — OK')
          PY

      # A translation PR must contain translations. `add-paths: '.'` committed
      # whatever else the caller's job had left dirty in the workspace, and
      # `base: github.ref_name` is `NN/merge` on a pull_request event - an
      # internal ref, not a branch, so the PR targeted a base that never
      # existed. These are shape checks; tests/translation-paths.test.sh and
      # tests/act/ cover the behaviour.
      - name: the translation PR is scoped, and only opened where a base branch exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          steps = yaml.safe_load(open('action.yml'))['runs']['steps']
          cpr = next(s for s in steps if s.get('id') == 'cpr')
          translate = next(s for s in steps if s.get('id') == 'ptc')
          with_block = cpr['with']

          add_paths = str(with_block['add-paths'])
          assert add_paths.strip() != '.', (
              'add-paths commits the whole workspace; scope it to translation output')
          assert 'steps.ptc.outputs.add-paths' in add_paths, (
              'add-paths must come from the paths the translate step observed')

          # An empty add-paths makes create-pull-request fall back to `git add
          # -A`, so "we wrote nothing" would commit the caller's workspace.
          assert "steps.ptc.outputs.add-paths != ''" in str(cpr['if']), (
              'the pull request step must be skipped when nothing was written')

          # The paths must be observed on disk. Reading them out of the config
          # cannot work: `output:` is sent to the API, while the CLI unpacks
          # next to the source file.
          assert 'lib/translation-paths.sh' in translate['run'], (
              'the written paths must be observed, not derived from the config')
          assert 'ptc_snapshot_worktree' in translate['run'], (
              'the working tree must be snapshotted before the run, so what the '
              'run wrote can be told from what the caller left behind')
          assert 'RUN_MARKER' not in translate['run'], (
              'a timestamp comparison drops translations unpacked from a ZIP, '
              'whose mtimes come from the archive')
          assert "'^ *output:'" not in translate['run'], (
              "the config's output: entries are not where translations land - the "
              "CLI unpacks next to the source file - so the path list must not be "
              "scraped out of the config again")

          gate = next((s for s in steps if s.get('id') == 'gate'), None)
          assert gate is not None, 'no event gate step found'
          for event in ('pull_request', 'pull_request_target', 'merge_group'):
              assert event in gate['run'], f'the gate must refuse {event}'
          assert 'REF_TYPE' in gate['run'], (
              'the gate must refuse a tag, where ref_name is not a branch')
          assert steps.index(gate) < steps.index(translate), (
              'the gate must run before the CLI: a refusal after translating bills the caller')

          # Assembled, never spelled: everything inside a run body is
          # interpolated before bash sees it, so a literal here would be
          # replaced by the branch name and the comparison could never hold.
          # Same reason as the OPEN above.
          expected_base = '$' + '{{ github.ref_name }' + '}'
          base = str(with_block['base'])
          assert base.strip() == expected_base, (
              'with the gate in place base is the pushed branch; anything else '
              'reintroduces the merge-ref question the gate settles')

          # Every input the script reads must arrive through env, never
          # interpolated into the body - the guard above enforces the second
          # half, this one keeps the first honest for the input added here.
          assert 'INPUT_CREATE_PR' in translate['env'], (
              'create-pr must reach the script through env, like every other input')
          assert 'add-paths<<' in translate['run'], (
              'the translate step must publish the add-paths output')
          print('translation PR scope, event gate and base OK')
          PY

      # The behavioural half of the above. act is not run here - it needs
      # docker and a 1.5 GB runner image - but this needs neither.
      - name: the observed path list behaves
        run: bash tests/translation-paths.test.sh

      # The GitLab component runs on alpine - busybox ash before before_script
      # installs bash - so this half is POSIX and is checked under both. dash
      # stands in for ash here; the same suite runs under ash locally.
      - name: the GitLab component commits only what the run wrote
        run: |
          set -euo pipefail
          TEST_SHELL_LABEL=bash bash tests/gitlab-scope.test.sh
          TEST_SHELL_LABEL=dash dash tests/gitlab-scope.test.sh
