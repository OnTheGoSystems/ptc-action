name: Self-test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Guardrail so we never publish a broken @v1: lint the vendored CLI, confirm it is
# the pinned version, and sanity-check the composite action metadata.
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PINNED_CLI_VERSION: '1.0.3'
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck the vendored CLI
        run: shellcheck ptc-cli.sh || true   # advisory: the CLI is owned upstream

      - name: vendored CLI matches the pinned version
        run: |
          set -euo pipefail
          got=$(grep -m1 -oE 'VERSION="[^"]+"' ptc-cli.sh | cut -d'"' -f2)
          echo "vendored ptc-cli VERSION=$got (expected $PINNED_CLI_VERSION)"
          test "$got" = "$PINNED_CLI_VERSION"

      - name: action.yml parses and declares required inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml, sys
          a = yaml.safe_load(open('action.yml'))
          assert a['runs']['using'] == 'composite', 'action must be composite'
          assert a['inputs']['api-token']['required'] is True, 'api-token must be required'
          # ci18-7277 — api-token is the ONLY required input: with nothing else
          # set, the action runs `ptc init` itself and uses what it detects.
          for optional in ('config-file', 'source-locale', 'patterns'):
              assert a['inputs'][optional].get('required', False) is False, f'{optional} must stay optional'
          run = a['runs']['steps'][0]['run']
          assert 'init --yes' in run, 'the action must be able to detect the layout itself'
          print('action.yml OK:', a['name'])
          PY

      - name: no input is interpolated into a run body
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          # Expression interpolation is resolved before bash parses the script,
          # so an input pasted into a run body executes whatever shell syntax it
          # carries. Inputs must arrive through env: and be read as "$INPUT_*".
          #
          # This file cannot spell the delimiters literally: everything inside a
          # run body is itself interpolated, so writing them here would make the
          # workflow fail to load. Hence the assembled OPEN below.
          OPEN = '$' + '{' + '{'
          steps = yaml.safe_load(open('action.yml'))['runs']['steps']
          offenders = []
          for step in steps:
              body = step.get('run')
              if not body:
                  continue
              for lineno, line in enumerate(body.splitlines(), 1):
                  if line.lstrip().startswith('#'):
                      continue
                  if OPEN in line:
                      offenders.append(f"{step.get('name', '?')} line {lineno}: {line.strip()}")
          assert not offenders, (
              'an input is interpolated into a run body; pass it via env instead:\n'
              + '\n'.join(offenders)
          )
          print('no expression interpolation inside any run body')
          PY

      - name: every third-party action is pinned to a commit SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, glob, sys
          bad = []
          for f in ['action.yml'] + glob.glob('.github/workflows/*.yml'):
              for n, line in enumerate(open(f), 1):
                  m = re.search(r'uses:\s*([\w.-]+/[\w.-]+)@(\S+)', line)
                  # actions/* are first-party GitHub actions; everything else must be SHA-pinned.
                  if m and not m.group(1).startswith('actions/') and not re.fullmatch(r'[0-9a-f]{40}', m.group(2)):
                      bad.append(f'{f}:{n} {m.group(1)}@{m.group(2)}')
          if bad:
              sys.exit('third-party action not SHA-pinned:\n  ' + '\n  '.join(bad))
          print('third-party action pinning OK')
          PY

      - name: GitLab component template parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml, glob
          files = glob.glob('templates/**/*.yml', recursive=True)
          assert files, 'no component templates found'
          for f in files:
              # list() forces the generator - safe_load_all alone parses nothing.
              docs = list(yaml.safe_load_all(open(f)))
              assert docs, f'{f} is empty'
              print(f'{f}: {len(docs)} document(s) OK')
          PY

      # ci18-7363: the template stays as a source for anyone mirroring it into
      # their OWN instance, but we must never hand out an address for it. A
      # component address is resolved by the customer's GitLab, so the
      # $CI_SERVER_FQDN in one we print is always their server, and the include
      # fails before any of our code runs.
      - name: no component address is handed out
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys
          # Our own path inside a component address — the exact string a reader
          # could copy. Prose about component: in general is fine.
          pattern = re.compile(r'component:.*OnTheGoSystems/ptc-action')
          bad = []
          for f in ['README.md', 'action.yml'] + glob.glob('templates/**/*.yml', recursive=True):
              for n, line in enumerate(open(f), 1):
                  if pattern.search(line):
                      bad.append(f'{f}:{n} {line.strip()}')
          if bad:
              sys.exit('a component address is being handed out; it cannot resolve '
                       'cross-instance:\n  ' + '\n  '.join(bad))
          print('no component address handed out — OK')
          PY
